{% extends "bookings/base.html" %}
{% load static %}

{% block css %}
    <!-- Подключение файла стилей -->
    <link rel="stylesheet" href="{% static 'css/basket1.css' %}">
{% endblock %}

{% block content %}
    <main class="container">
        <section>
            <h2 class="menu-title">Ваши заказы</h2>

            {% if basket %}
                <div class="restaurants-grid">
                    {% for booking in basket %}
                        <a href="{% url 'restaurants:feedback' %}" style="text-decoration: none;">
                            <article class="restaurant-card">
                                <div class="restaurant-img-wrapper">
                                    <img src="/media/{{ booking.restaurant.image }}" alt="Ресторан" class="restaurant-img">
                                    <span class="restaurant-badge">{{ booking.restaurant.category.name }}</span>
                                </div>
                                <div class="restaurant-content">
                                    <p class="restaurant-address">Заказ на {{ booking.time }}</p>
                                </div>
                            </article>
                        </a>
                    {% endfor %}
                </div>
            {% else %}
                <div class="no-results-box">
                    <div class="no-results-icon">
                        <svg viewBox="0 0 24 24" class="search-empty-icon">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                        </svg>
                    </div>
                    <h3 class="no-results-title">Пока ничего</h3>
                </div>
            {% endif %}
        </section>
    </main>
{% endblock %}
